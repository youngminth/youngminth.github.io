name: Deploy to GitHub Pages

on:
  push:
    branches:
      - master

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '14'
          cache: 'npm'

      - name: Git Identity 설정
        run: |
          git config --global user.email "github-actions@github.com"
          git config --global user.name "github-actions"

      - name: Install & Build
        run: |
          npm install
          npm install @emotion/react @emotion/styled react-helmet

      - name: Deploy
        run: npm run deploy
